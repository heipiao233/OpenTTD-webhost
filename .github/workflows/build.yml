name: Build OpenTTD for emscripten

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'OpenTTD ref'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.42
    steps:
    - uses: actions/checkout@v4
      with:
        repository: OpenTTD/OpenTTD
        ref: ${{ inputs.ref }}
    - name: Cache
      uses: actions/cache@v4
      with:
        path: /emsdk/upstream/emscripten/cache
        key: 3.1.42-${{ runner.os }}
    - name: Do patch
      run: |
        mkdir -p /emsdk/upstream/emscripten/tools/ports/contrib/
        cp os/emscripten/ports/liblzma.py /emsdk/upstream/emscripten/tools/ports/contrib/liblzma.py
    - name: Build (host tools)
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake .. -DOPTION_TOOLS_ONLY=ON
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc) --target tools
        echo "::endgroup::"
    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master
    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        emcmake cmake .. -DHOST_BINARY_DIR=../build-host
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc) --target openttd
        echo "::endgroup::"
    - name: Copy useful files
      run: |
        mkdir _site
        cp build/openttd.js build/openttd.html build/openttd.wasm build/openttd.data _site
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
